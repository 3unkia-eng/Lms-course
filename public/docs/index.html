document.addEventListener('click', e => {
  const tok = e.target.closest('[data-tok]'); if (tok) { openToken(tok.dataset.tok); return; }
  const op = e.target.closest('[data-open]'); if (op) { openToken(op.dataset.open); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const s = cp.dataset.copy; try { navigator.clipboard.writeText(s).then(() => { cp.textContent = 'Copied'; }, () => {}); } catch (_) {} }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

const PAGES = [];
const page = (id, group, title, render, small, icon) => PAGES.push({ id, group, title, render, small, icon });
const cnt = f => DATA.tokens.filter(f).length;
const pad = n => String(n).padStart(2, '0');
const FOUND = () => PAGES.filter(p => p.group === 'Foundations');
function head(eyebrow, id, title, lede) {
  const f = FOUND(), i = f.findIndex(p => p.id === id);
  return `<div class="eyebrow"><span>${eyebrow}</span>${i >= 0 ? `<span class="ct">${pad(i + 1)} / ${pad(f.length)}</span>` : ''}</div><h1 class="pt">${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}`;
}
function nextPrev(id) {
  const f = FOUND(), i = f.findIndex(p => p.id === id); if (i < 0) return '';
  const a = f[i - 1], b = f[i + 1];
  return `<nav class="next" aria-label="Pages">${a ? `<a href="#${a.id}"><small>Previous</small><span>${esc(a.title)}</span></a>` : ''}${b ? `<a href="#${b.id}"><small>Next</small><span>${esc(b.title)}</span></a>` : ''}</nav>`;
}
const H2 = (n, t, id) => `<h2${id ? ` id="${id}"` : ''}><span class="n">${n}</span>${t}</h2>`;
function collTable(cc) {
  return `<div class="tbl"><table><thead><tr><th>Collection</th><th>Level</th><th>Tokens</th><th>Modes</th><th>CSS mode attribute</th></tr></thead><tbody>${cc.map(c => `<tr><td>${esc(c.name)}</td><td>${c.level}</td><td class="num">${c.count}</td><td>${c.modes.map(esc).join(' / ')}</td><td>${c.attr ? c.modeSlugs.slice(1).map(s => `<code>[data-${c.attr}="${s}"]</code>`).join(' ') : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function ovPreview(c) {
  const map = { Button: () => V.Button({ label: 'Publish' }), Input: () => `<div class="x-field" style="width:180px">${ic('search')}<span class="x" style="color:var(--input-text-placeholder)">Search</span></div>`, Sidebar: () => `<div style="transform:scale(.45);transform-origin:center;margin:-140px 0">${V.Sidebar()}</div>`, Topbar: () => `<div style="transform:scale(.3);margin:0 -260px">${V.Topbar()}</div>`, Stepper: () => `<div style="transform:scale(.24);margin:0 -290px">${V.Stepper({})}</div>`, 'Course card': () => `<div style="transform:scale(.38);margin:-90px 0">${V['Course card']({})}</div>`, 'Session row': () => `<div style="transform:scale(.36);margin:0 -230px">${V['Session row']({})}</div>`, Card: () => `<div style="transform:scale(.5);margin:0 -120px">${V.Card()}</div>`, Tab: () => V.Tab({ group: 1 }), 'Nav item': () => V['Nav item']({ st: 'active' }) };
  return (map[c.name] || (() => V[c.name]({})))();
}

   <div><span class="k">Component</span><b>${cnt(t => t.l === 'component')}</b>Per part: <code>Button/filled/primary/background/hover</code>.</div>
  </div>

  <div class="grid2"><div class="panel"><h4>Light · default brand</h4>${chainHTML(ex.ch)}<p class="mono" style="margin:12px 0 0">${sw(ex.r.light)} ${ex.r.light}</p></div><div class="panel"><h4>Dark · red brand</h4>${chainHTML(ex.ch2)}<p class="mono" style="margin:12px 0 0">${sw(ex.r['dark-red'])} ${ex.r['dark-red']}</p></div></div>
  ${H2('02', 'Formula')}
  <div class="tbl"><table><thead><tr><th>Level</th><th>Formula</th><th>Example</th><th>Rule</th></tr></thead><tbody>
  <tr><td>Primitive color</td><td class="mono">Colors/{hue}/{step}</td><td class="mono">Colors/indigo/500</td><td>Only primitives contain hue names.</td></tr>
  <tr><td>Primitive size</td><td class="mono">Spacing/{n}</td><td class="mono">Spacing/2_5 = 10</td><td>n × 4px. Underscore = decimal point.</td></tr>
  <tr><td>Theme palette</td><td class="mono">Brand/{step} · Neutral/{step}</td><td class="mono">Brand/300</td><td>Same steps as primitives, swapped by mode.</td></tr>
  <tr><td>Semantic color</td><td class="mono">{Category}/{role}/{emphasis?}/{state?}</td><td class="mono">Surface/brand/soft/default</td><td>Category: Background, Surface, Border, Text, Icon. State: default, hover.</td></tr>
  <tr><td>Semantic spacing</td><td class="mono">{Gap|Padding}/{size}</td><td class="mono">Gap/MD</td><td>2XS, XS, SM, MD, LG, XL, 2XL.</td></tr>

  <tr><td>Semantic type</td><td class="mono">{Style}/{size}/{property}</td><td class="mono">Label/MD/lineheight</td><td>fontsize, lineheight, weight.</td></tr>
  <tr><td>Component</td><td class="mono">{Component}/{variant?}/{appearance?}/{part}/{property}/{state?}</td><td class="mono">Button/outlined/secondary/border/hover</td><td>Only the component name is capitalized.</td></tr>
  </tbody></table></div>
  <p>CSS name = <code>--</code> + Figma name, lowercase, with <code>/</code>, spaces and <code>_</code> replaced by <code>-</code>. Example: <code>Nav item/background/active</code> → <code>var(--nav-item-background-active)</code>.</p>

  ${nextPrev('naming')}`;
}, '', 'naming');

  </tbody></table></div>
  ${nextPrev('usage')}`, '', 'usage');

page('explorer', 'Tools', 'Token explorer', () => `${head('Tools', 'explorer', 'Token explorer', `All ${DATA.meta.total} tokens. Search by Figma or CSS name; click a row for its chain and dependents.`)}
  <input class="search" id="q" type="search" placeholder="Search e.g. surface/brand, gap, --button" aria-label="Search tokens">
  <div style="margin:12px 0;display:flex;gap:6px;flex-wrap:wrap" id="lv">${['all', 'primitive', 'theme', 'semantic', 'component'].map((l, i) => `<button class="copy" data-lv="${l}" aria-pressed="${!i}">${l}</button>`).join('')}</div>
  <div class="tbl"><table><thead><tr><th>Token</th><th>Level</th><th>Light / default</th><th>Dark</th><th>Used by</th></tr></thead><tbody id="tb"></tbody></table></div>`, '', 'explorer');

/* component pages */
DATA.components.forEach(c => page('c-' + slug(c.name), c.kind === 'Core' ? 'Core components' : 'Composite components', c.name, () => compPage(c), c.variants > 1 ? c.variants : '', c.kind === 'Core' ? 'core' : 'composite'));

function apiType(p) {
  if (p[1] === 'Variant') return p[3].split(' / ').map(v => `'${v}'`).join(' | ');
  return { Text: 'string', Boolean: 'boolean', 'Instance swap': 'IconName', Slot: 'ReactNode' }[p[1]] || p[1];
}
const camel = s => s.replace(/\(.*\)/, '').trim().replace(/[^a-zA-Z0-9]+(.)/g, (_, ch) => ch.toUpperCase()).replace(/^./, ch => ch.toLowerCase());
function compPage(c) {
  const ratio = r => r >= 4.5 ? `<span class="pass">${r} AA</span>` : r >= 3 ? `<span class="warnc">${r} AA large / UI</span>` : `<span class="fail">${r} fail</span>`;
  return `<div class="eyebrow"><span>${c.kind} component</span><span class="ct">Figma ${c.figma}</span></div><h1 class="pt">${esc(c.name)}</h1>
  <p class="lede">${esc(c.summary)}</p>
  <div class="meta"><span class="chip2 brand">${c.kind}</span>${c.built ? `<span class="chip2">Built from ${esc(c.built)}</span>` : ''}<span class="chip2">${c.variants} variant${c.variants > 1 ? 's' : ''}</span><span class="chip2"><a href="https://www.figma.com/design/fkI3mGHWAToov6nhyWUZx5/Foundation?node-id=${c.figma.replace(':', '-')}" target="_blank" rel="noopener">Open in Figma ${c.figma}</a></span><span class="chip2">v${c.changelog[0].v}</span></div>

  <h2 id="overview"><span class="n">01</span>Overview</h2>
  <div class="stage dots ds">${liveFor(c)}</div>
  <div class="grid2" style="margin-top:12px"><div class="panel"><h4>Use for</h4>${esc(c.use)}</div><div class="panel"><h4>Don't use for</h4>${esc(c.avoid)}</div></div>

  <h2 id="anatomy"><span class="n">02</span>Anatomy</h2>
  <div class="tbl"><table><thead><tr><th>#</th><th>Part</th><th>Description</th><th>Tokens</th></tr></thead><tbody>${c.anatomy.map((a, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(a[0])}</b></td><td>${esc(a[1])}</td><td class="mono" style="font-size:11px">${esc(a[2])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Spec</h3>
  <div class="tbl"><table><tbody>${Object.entries(c.spec).map(([k, v]) => `<tr><th style="width:120px">${k}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>

  <h2 id="properties"><span class="n">03</span>Properties (Figma)</h2>
  <div class="tbl"><table><thead><tr><th>Property</th><th>Type</th><th>Default</th><th>Values</th><th>Notes</th></tr></thead><tbody>${c.props.map(p => `<tr><td><b>${esc(p[0])}</b></td><td>${esc(p[1])}</td><td class="mono">${esc(p[2])}</td><td class="mono">${esc(p[3])}</td><td>${esc(p[4])}</td></tr>`).join('')}</tbody></table></div>

  <h2 id="states"><span class="n">04</span>States</h2>
  <p>Left: Light. Right: Dark. Both follow the Brand, Neutral, Radius and Font switches.</p>
  <div class="pair">${['light', 'dark'].map(m => `<div class="ds" data-fix-theme="${m}"><div class="cap">${m}</div><div class="states ${['Input','Card','Sidebar','Topbar','Stepper','Course card','Session row'].includes(c.name) ? 'wide' : ''}">${statesFor(c).map(([l, h]) => `<figure>${h}<figcaption>${esc(l)}</figcaption></figure>`).join('')}</div></div>`).join('')}</div>

  <h2 id="a11y"><span class="n">05</span>Accessibility checklist</h2>
  <ul class="check">${c.a11y.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
  <h3>Contrast (computed from tokens)</h3>
  <div class="tbl"><table><thead><tr><th>Pair</th><th>Foreground</th><th>Background</th><th>Light</th><th>Dark</th></tr></thead><tbody>${c.contrast.map(r => `<tr><td>${esc(r.label)}</td><td class="mono" style="font-size:11px">${sw(T[r.fg].r.light)} ${esc(r.fg)}</td><td class="mono" style="font-size:11px">${sw(T[r.bg].r.light)} ${esc(r.bg)}</td><td class="num">${ratio(r.light)}</td><td class="num">${ratio(r.dark)}</td></tr>`).join('')}</tbody></table></div>
  <p style="font-size:12px;color:var(--text-secondary)">AA: 4.5:1 for text, 3:1 for large text, icons and control borders (WCAG 1.4.3, 1.4.11). Disabled controls are exempt.</p>

  <h2 id="api"><span class="n">06</span>API</h2>
  <div class="tbl"><table><thead><tr><th>Prop (code)</th><th>Type</th><th>Default</th><th>Figma property</th></tr></thead><tbody>${c.props.map(p => `<tr><td class="mono">${camel(p[0])}</td><td class="mono" style="font-size:11px">${esc(apiType(p))}</td><td class="mono">${esc(p[2])}</td><td>${esc(p[0])} <small>(${esc(p[1])})</small></td></tr>`).join('')}</tbody></table></div>
  <h3>Component tokens</h3>${c.tokens.length ? tokTable(c.tokens) : '<p>Uses tokens of the components it is built from.</p>'}

  <h2 id="dodont"><span class="n">07</span>Do & Don't</h2>
  <div class="dodont"><div class="panel"><h4 class="pass">Do</h4><ul>${c.do.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel dont"><h4 class="fail">Don't</h4><ul>${c.dont.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>

  <h2 id="edge"><span class="n">08</span>Edge cases & limits</h2>
  <ul>${c.edge.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

  <h2 id="changelog"><span class="n">09</span>Changelog</h2>
  <div class="tbl"><table><thead><tr><th>Version</th><th>Date</th><th>Type</th><th>Change</th></tr></thead><tbody>${c.changelog.map(l => `<tr><td class="mono">${l.v}</td><td class="num">${l.d}</td><td><span class="chip2">${l.t}</span></td><td>${esc(l.note)}</td></tr>`).join('')}</tbody></table></div>`;
}

page('versioning', 'Process', 'Versioning & changes', () => `<div class="eyebrow"><span>Process</span></div><h1 class="pt">Versioning & <em>change</em></h1>
  <p class="lede">The system follows semantic versioning, like any software package. Figma library releases and git tags share one version number.</p>
  <div class="lvl" style="grid-template-columns:repeat(3,minmax(0,1fr))">
   <div><span class="k">Patch · 1.0.x</span><b>Fixes</b>No visual or API change for consumers. Examples here: renaming <code>oulined → outlined</code>; re-aliasing <code>Surface/brand/*</code> to <code>Brand/*</code> while Default brand values stay identical; fixing a wrong token binding on one layer.</div>
   <div><span class="k">Minor · 1.x.0</span><b>Additions</b>Backward-compatible. Examples: adding <code>State=focus</code> to Button, a Loading variant, Checkbox indeterminate, a new Badge status, a new composite like Modal.</div>
   <div><span class="k">Major · x.0.0</span><b>Breaking</b>Consumers must change something. Examples: renaming <code>Redius → Radius</code> (CSS names change), removing a variant, changing a public property such as Disabled, a full redesign.</div>
  </div>
  <h2>Change process</h2>
  <div class="steps">${[
   ['Request', 'Anyone files a change request: what, why, which screens. Template: problem · proposal · components/tokens touched · screenshots.'],
   ['Impact & risk analysis', 'List every token and component affected (the explorer\'s "Used by" list shows dependents), decide patch / minor / major, check contrast in both themes and both brands.'],
   ['Design & code', 'Change Figma Variables/components and the code in the same branch. AI agents may draft both through MCP; drafts are never merged unreviewed.'],
   ['Review', 'The design system owner or the component owner approves the design, the docs and the code. AI-written docs are marked "AI draft" until approved.'],
   ['Changelog', 'Add an entry per component (version, date, type, one-line change) and to the system log below.'],
   ['Publish', 'Publish the Figma library with the version in the description, tag git <code>v1.x.y</code>, regenerate tokens.css / agent.md, republish this site.']].map((s, i) => `<div><span class="n">${i + 1}</span><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join('')}</div>
  <h2>System changelog</h2>
  <div class="tbl"><table><thead><tr><th>Version</th><th>Date</th><th>Type</th><th>Change</th></tr></thead><tbody>
   <tr><td class="mono">1.4.0</td><td class="num">2026-11-22</td><td><span class="chip2">minor</span></td><td>New semantic token Border/focus (Brand/600 light, Brand/300 dark; 6.29:1 on white). Boolean property "Focus ring" (2px, 2px outside, hidden by default) added to Button, Icon button, Tab, Nav item, Toggle and Checkbox: 23 variants, no new variant combinations. "Surface/brand/soft/default 2" renamed Surface/brand/subtle/default; tokens.css keeps --surface-brand-soft-default-2 as a deprecated alias until 2.0.0.</td></tr>
   <tr><td class="mono">1.3.0</td><td class="num">2026-11-22</td><td><span class="chip2">minor</span></td><td>Light mode primary brand fill one step darker: Surface/brand/medium/default and Background/brand → Brand/600, Surface/brand/medium/hover → Brand/700. White labels and icons on it (filled Button, checked Checkbox, Step check, Toggle on, Sidebar logo) now reach 6.29:1.</td></tr>
   <tr><td class="mono">1.2.0</td><td class="num">2026-11-22</td><td><span class="chip2">minor</span></td><td>Text/brand and Icon/brand (light) moved from Brand/500 to Brand/600: brand text now passes 4.5:1 on white and on brand-soft surfaces (Tab, Nav item, Badge info, Avatar, Step, Session row, outlined Button).</td></tr>
   <tr><td class="mono">1.1.0</td><td class="num">2026-11-22</td><td><span class="chip2">minor</span></td><td>Dark-mode contrast: Text/Icon error, success, warning, info → 300 step; Surface/Background status → 900 step; Text/Icon secondary → Neutral/400 (8.27:1 on black). Global Redius/* renamed Radius/*; tokens.css keeps --redius-* as deprecated aliases until 2.0.0.</td></tr>
   <tr><td class="mono">1.0.2</td><td class="num">2026-11-22</td><td><span class="chip2">patch</span></td><td>13 semantic tokens re-aliased in Figma: 8 brand tokens (Background/brand, Surface/brand/*, Border/brand, Text/brand, Icon/brand) now go through Brand/*; 5 surfaces (Surface/primary, secondary, tertiary/hover) through Neutral/*. The red brand and Neutral modes now reach every component. Default brand unchanged; light gray surfaces shift slightly (e.g. Surface/secondary/default #f5f5f5 → #f3f4f6).</td></tr>
   <tr><td class="mono">1.0.1</td><td class="num">2026-11-22</td><td><span class="chip2">patch</span></td><td>Token typos fixed (button → Button, oulined → outlined, Lable → Label, linehight → lineheight, Defult → Default, None rediuse → None radius). Added Gap/2XS = 4 and Gap/2XL = 32.</td></tr>
   <tr><td class="mono">1.0.0</td><td class="num">2026-11-22</td><td><span class="chip2">minor</span></td><td>11 Core and 5 Composite components on page LMS DASHBOARD with a Component token layer (115 tokens). Added Text/disabled.</td></tr>
  </tbody></table></div>
  <h2>Pending proposals</h2>
  <div class="tbl"><table><thead><tr><th>Proposal</th><th>Type</th><th>Source</th></tr></thead><tbody>${DATA.findings.map((f, i) => `<tr><td>${esc(f.title)}</td><td>${/major/i.test(f.fix) ? 'major' : /minor/i.test(f.fix) ? 'minor' : 'patch'}</td><td><a href="#audit">Audit #${i + 1}</a></td></tr>`).join('')}</tbody></table></div>`);
/* ---------- router ---------- */
function renderRail(cur) {
  const groups = [...new Set(PAGES.map(p => p.group))];
  document.getElementById('rail').innerHTML = `<a class="brandmark" href="#overview"><span class="tile">${ic('cap')}</span><span><b>LMS Design System</b><span>Foundation · v${DATA.meta.version}</span></span></a>` +
    groups.map(g => (g === 'Foundations' ? '' : `<h6>${g}</h6>`) + PAGES.filter(p => p.group === g).map(p => `<a class="it ${g.includes('components') ? 'sub' : ''}" href="#${p.id}" ${p.id === cur ? 'aria-current="page"' : ''}>${nic(p.icon)}<span>${esc(p.title)}</span>${p.small !== '' && p.small != null ? `<small>${p.small}</small>` : (['naming', 'usage'].includes(p.id) ? `<small>${arrow.replace('<svg', '<svg style="width:14px;height:14px"')}</small>` : '<small></small>')}</a>`).join('')).join('');
}
function route() {
  const id = (location.hash || '#overview').slice(1);
  const p = PAGES.find(x => x.id === id) || PAGES[0];
  renderRail(p.id);
  document.getElementById('crumb').innerHTML = `<span class="p0">Design system</span><i>/</i>${p.group !== 'Foundations' ? `<span class="p0">${esc(p.group)}</span><i>/</i>` : ''}<b>${esc(p.title)}</b>`;
  document.getElementById('view').innerHTML = p.render();
  if (p.id === 'explorer') initExplorer();
  applyModes(document.getElementById('view'));
  document.getElementById('rail').classList.remove('open');
  window.scrollTo(0, 0);
}
function initExplorer() {
  let lv = 'all';
  const draw = () => {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const rows = DATA.tokens.filter(t => (lv === 'all' || t.l === lv) && (!q || t.n.toLowerCase().includes(q) || t.css.includes(q))).slice(0, 300);
    document.getElementById('tb').innerHTML = rows.map(t => `<tr data-tok="${esc(t.n)}" style="cursor:pointer"><td><b class="mono" style="font-size:12px">${esc(t.n)}</b><br><small class="mono" style="color:var(--muted)">${t.css}</small></td><td>${t.l}</td><td class="num mono">${t.t === 'C' ? sw(t.r.light) + ' ' + t.r.light : esc(t.r.default)}</td><td class="num mono">${t.t === 'C' ? sw(t.r.dark) + ' ' + t.r.dark : (t.r.alt ? esc(t.r.alt) : '—')}</td><td class="num">${t.u.length}</td></tr>`).join('') || '<tr><td colspan="5">No tokens match.</td></tr>';
  };
  document.getElementById('q').addEventListener('input', draw);
  document.getElementById('lv').addEventListener('click', e => { const b = e.target.closest('[data-lv]'); if (!b) return; lv = b.dataset.lv; document.querySelectorAll('#lv [data-lv]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  draw();
}
document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('rail').classList.toggle('open'));
window.addEventListener('hashchange', route);
PAGES.forEach(p => { if (!p.icon) p.icon = NI[p.id] ? p.id : "core"; });
renderBar();
applyModes();
route();
</script>
