  let lv = 'all';
  const draw = () => {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const rows = DATA.tokens.filter(t => (lv === 'all' || t.l === lv) && (!q || t.n.toLowerCase().includes(q) || t.css.includes(q))).slice(0, 300);
    document.getElementById('tb').innerHTML = rows.map(t => `<tr data-tok="${esc(t.n)}" style="cursor:pointer"><td><b class="mono" style="font-size:12px">${esc(t.n)}</b><br><small class="mono" style="color:var(--muted)">${t.css}</small></td><td>${t.l}</td><td class="num mono">${t.t === 'C' ? sw(t.r.light) + ' ' + t.r.light : esc(t.r.default)}</td><td class="num mono">${t.t === 'C' ? sw(t.r.dark) + ' ' + t.r.dark : (t.r.alt ? esc(t.r.alt) : '—')}</td><td class="num">${t.u.length}</td></tr>`).join('') || '<tr><td colspan="5">No tokens match.</td></tr>';
  };
  document.getElementById('q').addEventListener('input', draw);
  document.getElementById('lv').addEventListener('click', e => { const b = e.target.closest('[data-lv]'); if (!b) return; lv = b.dataset.lv; document.querySelectorAll('#lv [data-lv]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  draw();
}
document.getElementById('menuBtn').addEventListener('click', () => setNav(!document.getElementById('rail').classList.contains('open')));
document.getElementById('scrim').addEventListener('click', () => setNav(false));
window.addEventListener('hashchange', route);
PAGES.forEach(p => { if (!p.icon) p.icon = NI[p.id] ? p.id : "core"; });
renderBar();
applyModes();
route();
</script>
